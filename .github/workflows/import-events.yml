run-name: Import eventi${{ inputs.dry_run && ' (dry-run)' || '' }}${{ inputs.regione && format(' [{0}]', inputs.regione) || '' }}

on:
  schedule:
    # Terza riserva (10:17 UTC). L'avvio puntuale delle 08:17 UTC (dopo il reset della quota Firestore, che avviene a
    # mezzanotte del Pacifico = 07:00 o 08:00 UTC) è il Cron Trigger del Worker in /scheduler, che chiama workflow_dispatch con
    # auto=true. Il cron di GitHub può ritardare di ore o saltare: chi parte per secondo salta se l'import di oggi c'è già.
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo stampa, senza scrivere su Firestore"
        type: boolean
        default: false
      regione:
        description: "Una sola regione (slug, per esempio lombardia); vuoto = tutte quelle con fonti attive"
        type: string
        default: ""
      reconcile:
        description: "Rilegge gli eventi da Firestore ignorando il manifest locale (riconciliazione completa)"
        type: boolean
        default: false
      cleanup_limits:
        description: "La pulizia elimina anche i contatori limits/{uid} scaduti (senza: li registra solo nel log). Per le esecuzioni automatiche vale la variabile del repo CLEANUP_LIMITS=true"
        type: boolean
        default: false
      auto:
        description: "Avvio automatico (Worker /scheduler): salta se l'import completo di oggi è già partito"
        type: boolean
        default: false
      ip_interval:
        description: "Secondi minimi tra due richieste allo stesso IP (vuoto = 1,0, il valore dell'importer). Per confrontare i limiti di rete in due dry-run"
        type: string
        default: ""
      forza_errore:
        description: "Solo con dry-run, per provare il ritento: slug di una regione il cui primo tentativo fallisce apposta (vuoto = nessuna)"
        type: string
        default: ""
      forza_zero:
        description: "Solo con dry-run, per provare la regione a zero eventi: slug di una regione i cui eventi si scartano al primo giro (la rilettura li recupera; con forza_sempre anche alla rilettura, quindi la regione si «tiene»)"
        type: string
        default: ""
      forza_sempre:
        description: "Con forza_errore: fallisce anche il ritento, per vedere l'avviso. Con forza_zero: scarta anche la rilettura (solo dry-run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: import-events
  cancel-in-progress: false

defaults:
  run:
    working-directory: tools/importer

jobs:
  # Una sola esecuzione completa al giorno: i tre avvii (Worker 08:17, cron GitHub 10:17, lancio manuale con auto) si
  # serializzano con `concurrency` e i successivi trovano quella di oggi. I lanci manuali senza auto non sono controllati.
  guard:
    # Gli input compaiono nel nome del job: l'API dei run non li espone e `guard` li legge da qui (ci_report.is_full_import).
    name: guard (dry_run=${{ inputs.dry_run || false }}, regione=${{ inputs.regione }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO: ${{ github.event_name == 'schedule' || inputs.auto }}
        run: python ci_report.py guard

  plan:
    needs: guard
    if: ${{ needs.guard.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.matrix.outputs.include }}
      writes: ${{ steps.matrix.outputs.writes }}
      geocode: ${{ steps.matrix.outputs.geocode }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/importer/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      # Regioni con almeno una fonte attiva e quote per job: le soglie giornaliere si dividono tra i job.
      # Ogni regione si riconcilia con Firestore in un giorno fisso della settimana (ci_report.reconcile_days).
      # Eventi per regione dell'ultimo import (scritti dal job cleanup): fissano il minimo di letture di ogni job.
      - uses: actions/cache/restore@v5
        with:
          path: tools/importer/sizes.json
          key: importer-sizes-${{ github.run_id }}
          restore-keys: importer-sizes-
      - id: matrix
        env:
          ONLY: ${{ inputs.regione }}
          RECONCILE: ${{ inputs.reconcile }}
        run: python ci_report.py matrix

  import:
    needs: plan
    runs-on: ubuntu-latest
    # Misurato nel run del 3/11/2026: la Lombardia (271 comuni, 4 fonti in parallelo, 1 richiesta/s per host) impiega ~65 min, gli altri
    # job meno; i 150+ min di Piemonte e Veneto erano host irraggiungibili (ora 15 s di connessione e ricordati tra i run) e ogni
    # fonte ha un tetto di 10 minuti (--source-budget). 90 minuti sono la rete di sicurezza. Nominatim: 0,25 richieste/s per job.
    timeout-minutes: 90
    # actions: read solo qui, per scaricare l'artifact del Mac (#54); il resto dei job resta con il solo contents: read
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    env:
      # 4 job in parallelo × 1 richiesta ogni 4 s = 1 richiesta al secondo in tutto verso Nominatim
      NOMINATIM_INTERVAL: "4"
      # log in tempo reale: senza, lo stdout è bufferizzato e i tempi per fonte compaiono solo a fine job
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/importer/requirements.txt
      - run: pip install -r requirements.txt
      # Cache per regione: meno richieste a Nominatim e ai siti dei Comuni (le pagine invariate rispondono 304).
      # Il dry-run la legge soltanto: salvarla sposterebbe in avanti la più recente (con manifest e host irraggiungibili
      # dell'ultimo import vero) e il run vero successivo la ripristinerebbe al posto di quella giusta (ticket #16).
      # Vale anche per unreachable.json (host parcheggiati e subnet giù, chiavi net:<subnet>).
      # NON aggiungere altri percorsi a questo elenco: la versione di una cache dipende dai percorsi, e con un elenco diverso
      # le cache già salvate (anche quelle di main) non si ripristinano più. I file nuovi vanno in un passo a parte (health.json qui sotto).
      - uses: actions/cache/restore@v5
        if: ${{ inputs.dry_run }}
        with:
          path: |
            tools/importer/geocache.json
            tools/importer/.httpcache
            tools/importer/unreachable.json
            tools/importer/manifests
          key: importer-${{ matrix.region }}-${{ github.run_id }}
          restore-keys: importer-${{ matrix.region }}-
      - uses: actions/cache@v5
        if: ${{ !inputs.dry_run }}
        with:
          path: |
            tools/importer/geocache.json
            tools/importer/.httpcache
            tools/importer/unreachable.json
            tools/importer/manifests
          key: importer-${{ matrix.region }}-${{ github.run_id }}
          restore-keys: importer-${{ matrix.region }}-
      # Salute delle fonti (lastOkAt, interruzioni): cache a parte, così la cache sopra resta compatibile con quelle già salvate.
      # Stessa regola del dry-run: solo ripristino (ticket #16).
      - uses: actions/cache/restore@v5
        if: ${{ inputs.dry_run }}
        with:
          path: tools/importer/health.json
          key: importer-health-${{ matrix.region }}-${{ github.run_id }}
          restore-keys: importer-health-${{ matrix.region }}-
      - uses: actions/cache@v5
        if: ${{ !inputs.dry_run }}
        with:
          path: tools/importer/health.json
          key: importer-health-${{ matrix.region }}-${{ github.run_id }}
          restore-keys: importer-health-${{ matrix.region }}-
      # Dati scaricati dal Mac mini (#54): artifact dell'ultimo scarica-fonti riuscito su main. Passo senza segreti; se manca o
      # fallisce, le fonti del Mac restano saltate come prima. I file sono dati non fidati: l'importer li rivalida (filesource.py).
      - name: Dati del Mac mini
        id: mac
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci_report.py mac-artifact fonti-mac
      - name: Importer
        env:
          MAC_DIR: ${{ steps.mac.outputs.dir }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # solo in questo step (non nel job): Ticketmaster Discovery API; il log passa da logsafe (apikey=***)
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          # via ambiente e non nel comando: l'input è testo libero (run.py lo legge come numero e rifiuta il resto)
          IP_INTERVAL: ${{ inputs.ip_interval }}
          # ritento (ci_report.run_with_retry): se run.py esce con 1 (nessun evento raccolto: il sito di un Comune ha risposto con
          # la lista vuota, Molise 27 e 28/11) si riprova UNA volta dopo RETRY_WAIT secondi; il codice 1 arriva prima di ogni scrittura
          # su Firestore, quindi non raddoppia le scritture. Quota superata (2) e timeout non si ritentano. L'annotazione
          # ::error compare solo se anche il ritento fallisce: è l'unico caso in cui il job (e la run) diventa rossa.
          REGION: ${{ matrix.region }}
          RETRY_WAIT: "300"
          # prova del ritento senza import reale: valgono solo con il dry-run (FORZA_ERRORE vuoto = nessun errore forzato)
          DRY_RUN: ${{ inputs.dry_run }}
          FORZA_ERRORE: ${{ inputs.forza_errore }}
          # regione a zero eventi (run.py: collect + hold_zero_regions): rilettura senza cache, poi «tenuta» se ieri aveva eventi;
          # exit 1 (e questo ritento) solo se mai avuta o a zero da HOLD_DAYS giorni. FORZA_ZERO la prova nel dry-run.
          FORZA_ZERO: ${{ inputs.forza_zero }}
          FORZA_SEMPRE: ${{ inputs.forza_sempre }}
        run: >
          python ci_report.py retry
          python run.py --regione ${{ matrix.region }}
          --max-reads ${{ matrix.reads }} --max-writes ${{ needs.plan.outputs.writes }}
          --max-geocode ${{ inputs.dry_run && 20 || needs.plan.outputs.geocode }}
          --stats-out stats-${{ matrix.region }}.json
          --sitemap-out sitemap-${{ matrix.region }}.json
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ (inputs.reconcile || matrix.reconcile) && '--reconcile' || '' }}
          ${IP_INTERVAL:+--ip-interval "$IP_INTERVAL"}
          ${MAC_DIR:+--fonti-mac "$MAC_DIR"}
      - uses: actions/upload-artifact@v6
        if: ${{ !inputs.dry_run }}
        with:
          name: stats-${{ matrix.region }}
          path: tools/importer/stats-${{ matrix.region }}.json
          if-no-files-found: ignore
      # Eventi della regione per la sitemap (id, titolo in slug, città, fine): il job cleanup li unisce, senza leggere i bundle (#20).
      - uses: actions/upload-artifact@v6
        if: ${{ !inputs.dry_run }}
        with:
          name: sitemap-${{ matrix.region }}
          path: tools/importer/sitemap-${{ matrix.region }}.json
          if-no-files-found: ignore

  cleanup:
    needs: import
    # Anche se una regione è fallita: la pulizia e il riepilogo servono comunque.
    if: ${{ always() && needs.import.result != 'skipped' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      drop: ${{ steps.calo.outputs.drop }}
      report: ${{ steps.calo.outputs.report }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/importer/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pulizia del database
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python cleanup.py --stats-out cleanup.json ${{ (inputs.cleanup_limits || vars.CLEANUP_LIMITS == 'true') && '--delete-limits' || '' }}
      - uses: actions/download-artifact@v7
        with:
          pattern: stats-*
          path: tools/importer/stats  # i run girano in tools/importer, download-artifact parte dalla radice
      # Un solo riepilogo: eventi per regione, letture, scritture e cancellazioni rispetto alle quote.
      - name: Riepilogo
        run: python ci_report.py summary stats cleanup.json
      # Aggiorna le dimensioni per regione (le regioni fallite mantengono il valore precedente); la cache si salva a fine job.
      - uses: actions/cache@v5
        with:
          path: tools/importer/sizes.json
          key: importer-sizes-${{ github.run_id }}
          restore-keys: importer-sizes-
      - run: python ci_report.py sizes stats sizes.json
      # Sitemap (#20): le parti delle regioni appena importate sostituiscono quelle della cache (le altre restano), poi un solo
      # job scrive i documenti bundles/sm_* se sono cambiati. Una lettura per la copertura e una per documento: ~10 letture.
      # La cache si salva a fine job; senza parti nuove (import falliti) il passo non scrive nulla.
      - uses: actions/cache@v5
        with:
          path: tools/importer/sitemap-parts
          key: importer-sitemap-parts-${{ github.run_id }}
          restore-keys: importer-sitemap-parts-
      - uses: actions/download-artifact@v7
        continue-on-error: true  # nessuna regione importata: valgono le parti della cache
        with:
          pattern: sitemap-*
          path: tools/importer/sitemap-parts
          merge-multiple: true
      - name: Sitemap
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python sitemap.py build sitemap-parts
      # Avviso di calo (#89), ultimo passo: non fallisce mai (cache e sitemap si salvano a fine job). Lo storico degli ultimi
      # 14 giorni sta in una cache a parte; soglie in ci_report.py e in docs/importer.md. Il fallimento è del job avviso-calo.
      - uses: actions/cache@v5
        with:
          path: tools/importer/calo.json
          key: importer-calo-${{ github.run_id }}
          restore-keys: importer-calo-
      - name: Controllo del calo di eventi
        id: calo
        run: python ci_report.py check-drop stats calo.json

  # Fa fallire la run se una regione o una fonte grande è calata (arriva l'email standard di GitHub): gli eventi sono già
  # scritti e la pulizia è fatta, il calo non blocca nulla. Il guard conta anche le run fallite, quindi niente secondo import.
  avviso-calo:
    needs: cleanup
    if: ${{ needs.cleanup.outputs.drop == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .  # nessun checkout: la cartella dell'importer non c'è
    steps:
      - name: Calo di eventi
        env:
          REPORT: ${{ needs.cleanup.outputs.report }}
        run: |
          echo "$REPORT" | while IFS= read -r line; do echo "::error title=Calo di eventi::$line"; done
          exit 1
