name: Scarica fonti dal Mac mini

# Scarica gli eventi grezzi delle fonti che il runner GitHub non raggiunge (#54), con il runner self-hosted del Mac mini.
# Nessun segreto, nessun accesso a Firestore: pubblica solo l'artifact `fonti-mac`, che l'importer rilegge e rivalida.
# Solo `schedule` e `workflow_dispatch`, solo da main. Avvio puntuale alle 06:45 UTC dal Worker `scheduler/` (Cron Trigger →
# workflow_dispatch), come per l'import; il cron di GitHub (07:30 UTC) è la riserva, perché può ritardare o saltare.
# Il job `guard` salta la riserva se oggi (UTC, dalle 06:00) esiste già un run riuscito, in corso o in coda: niente doppie
# esecuzioni. 06:45 UTC = 07:45 CET / 08:45 CEST, prima dell'import (08:17 UTC); il Mac è sempre acceso (solo lo schermo si spegne).
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scarica-fonti
  cancel-in-progress: false

defaults:
  run:
    working-directory: tools/importer

jobs:
  guard:
    if: ${{ github.repository == 'AndreaAzzarello/EventiVicini' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    defaults:
      run:
        working-directory: .
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          go=true
          if [ "$EVENT" = "schedule" ]; then
            since="$(date -u +%F)T06:00:00Z"
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/scarica-fonti.yml/runs?per_page=30"               --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(.created_at >= \"$since\") | select(.status != \"completed\" or .conclusion == \"success\")] | length")
            if [ "${n:-0}" -gt 0 ]; then go=false; echo "Oggi c'è già un run di scarica-fonti ($n): salto la riserva."; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  scarica:
    needs: guard
    if: ${{ needs.guard.outputs.go == 'true' }}
    runs-on: [self-hosted, macOS, ARM64, mac-eventi]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Python 3.11 o più recente
        run: |
          PY=$(command -v python3.13 || command -v python3.12 || command -v python3.11 || true)
          [ -n "$PY" ] || { echo "::error::serve Python 3.11+ per l'utente runner-eventi (vedi #54: brew install python@3.12, poi aggiorna .path del runner)"; exit 1; }
          "$PY" --version
          "$PY" -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt
      - name: Scarica
        env:
          PYTHONUNBUFFERED: "1"
        run: .venv/bin/python scarica.py --list sources/mac-mini.txt --out fonti-mac
      - uses: actions/upload-artifact@v6
        with:
          name: fonti-mac
          path: tools/importer/fonti-mac
          retention-days: 3
          if-no-files-found: error
