name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Test dell'importer (pytest): senza rete né segreti, tutto con mock (#29).
  importer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/importer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/importer/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

  # Test e2e Playwright contro gli emulatori Firebase (auth + firestore). Nessun segreto: .env.example ha solo valori demo.
  # #15 (mappa desktop instabile) è saltato in CI da test.fixme; niente retry, così un'instabilità nuova si vede.
  # Non è tra i controlli obbligatori di main finché non ha dato qualche run verde di fila.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          check-latest: true
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            firebase/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # test:e2e usa firebase-tools di firebase/node_modules
      - run: npm ci
        working-directory: firebase
      - run: npm ci
        working-directory: web
      - run: cp .env.example .env
        working-directory: web
      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: web
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        working-directory: web
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npm run test:e2e
        working-directory: web
      # Solo tracce e risultati dei test falliti; mai web/.review (screenshot di controllo a occhio)
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-test-results
          path: web/test-results/
          retention-days: 7

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          check-latest: true
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
